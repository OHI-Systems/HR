let token='',user=null,headers=[],rows=[],descriptions=[],currentPage='employees';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let bridgeSeq=0;const bridgePending=new Map();
function call(fn,...args){
  return new Promise((resolve,reject)=>{
    if(!['addHRUser','deleteEmployee','getHRData','listHRUsers','login','logout','saveEmployee'].includes(fn)) return reject(new Error('عملية غير مسموح بها'));
    const id=++bridgeSeq; const timer=setTimeout(()=>{bridgePending.delete(id);reject(new Error('انتهت مهلة الاتصال بالخادم. أعد المحاولة.'));},20000);
    bridgePending.set(id,{resolve,reject,timer});
    const frame=document.getElementById('ohiBridge');
    if(!frame || !frame.contentWindow){clearTimeout(timer);bridgePending.delete(id);return reject(new Error('تعذر تهيئة الاتصال بالخادم.'))}
    frame.contentWindow.postMessage({channel:'OHI_HR_BRIDGE',id,fn,args},'*');
  });
}
window.addEventListener('message',event=>{
  const frame=document.getElementById('ohiBridge');
  if(!frame || event.source!==frame.contentWindow) return;
  let host='';try{host=new URL(event.origin).hostname}catch(e){return}
  if(!(host==='script.google.com'||host.endsWith('.googleusercontent.com'))) return;
  const m=event.data;if(!m||m.channel!=='OHI_HR_BRIDGE_RESULT'||!bridgePending.has(m.id))return;
  const p=bridgePending.get(m.id);clearTimeout(p.timer);bridgePending.delete(m.id);
  if(m.ok)p.resolve(m.value);else p.reject(new Error(m.error||'حدث خطأ في الخادم'));
});
async function doLogin(){ $('loginMsg').textContent='جارٍ التحقق...';try{const r=await call('login',$('username').value,$('password').value);token=r.token;user=r.user;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userInfo').textContent='المستخدم: '+user.username+' · '+user.role;$('usersNav').classList.toggle('hidden',user.role!=='Admin');await loadData()}catch(e){$('loginMsg').textContent=e.message}}
async function doLogout(){try{await call('logout',token)}catch(e){}token='';$('app').classList.add('hidden');$('loginView').classList.remove('hidden');$('password').value=''}async function loadData(){try{const d=await call('getHRData',token);headers=d.headers;rows=d.rows;descriptions=d.descriptions;renderEmployees()}catch(e){$('content').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function showPage(p,btn){currentPage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');$('pageTitle').textContent=p==='users'?'إدارة المستخدمين':p==='reports'?'التقارير والطباعة':'بيانات الموظفين';$('addBtn').classList.toggle('hidden',p!=='employees'||user.role==='Viewer');if(p==='employees')renderEmployees();else if(p==='reports')renderReports();else renderUsers()}

const LIST_FIELDS=['الرقم المسلسل','كود الموظف','اللقب','اسم الموظف','الإدارة','المسمى الوظيفي'];
function listColumnIndexes(){return LIST_FIELDS.map(h=>headers.indexOf(h)).filter(i=>i>=0)}
function renderEmployees(){
 currentPage='employees';
 const search='<div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو الكود أو الإدارة أو المسمى..." oninput="drawRows()"><button class="secondary" onclick="printEmployees()">طباعة الكشف</button></div>';
 const cards='<div class="cards"><div class="card"><div class="muted">إجمالي الموظفين</div><div class="metric">'+rows.length+'</div></div><div class="card"><div class="muted">الإدارات المختلفة</div><div class="metric">'+new Set(rows.map(r=>r[headers.indexOf('الإدارة')]).filter(Boolean)).size+'</div></div><div class="card"><div class="muted">المسميات الوظيفية</div><div class="metric">'+new Set(rows.map(r=>r[headers.indexOf('المسمى الوظيفي')]).filter(Boolean)).size+'</div></div></div>';
 const cols=listColumnIndexes();
 $('content').innerHTML=cards+search+'<div class="table-wrap"><table><thead><tr>'+cols.map(i=>'<th>'+esc(headers[i])+'</th>').join('')+'<th>إجراءات</th></tr></thead><tbody id="rowsBody"></tbody></table></div>';
 drawRows()
}
function filteredRows(){
 const q=($('search')?.value||'').trim().toLowerCase();
 return rows.map((r,i)=>({r,i})).filter(o=>!q||o.r.some(v=>String(v).toLowerCase().includes(q)));
}
function drawRows(){
 const cols=listColumnIndexes();
 $('rowsBody').innerHTML=filteredRows().map(o=>'<tr>'+cols.map(i=>'<td>'+esc(o.r[i])+'</td>').join('')+'<td><div class="actions"><button class="secondary" onclick="viewEmployee('+o.i+')">عرض</button>'+(user.role!=='Viewer'?'<button class="secondary" onclick="openForm('+o.i+')">تعديل</button>':'')+(user.role==='Admin'?'<button class="danger" onclick="removeEmployee('+o.i+')">حذف</button>':'')+'</div></td></tr>').join('')||'<tr><td colspan="'+(cols.length+1)+'">لا توجد نتائج</td></tr>';
}

 const data=filteredRows();

 printHtml('كشف الموظفين',table,'عدد الموظفين: '+data.length);
}
function openForm(idx=null){const r=idx===null?Array(headers.length).fill(''):[...rows[idx]];const vals=r.map((v,i)=>'<label>'+esc(headers[i])+'<input id="f'+i+'" value="'+esc(v)+'"></label>').join('');$('content').innerHTML='<div class="panel"><h3>'+(idx===null?'إضافة موظف':'تعديل بيانات موظف')+'</h3><div class="form-grid">'+vals+'</div><div class="toolbar" style="margin-top:18px"><button onclick="saveForm('+(idx===null?'null':idx)+')">حفظ</button><button class="secondary" onclick="renderEmployees()">إلغاء</button></div><div id="formMsg" class="muted"></div></div>'}
async function saveForm(idx){const values=headers.map((_,i)=>$('f'+i).value);try{const sheetRow=idx===null?null:idx+2;const msg=await call('saveEmployee',token,{row:sheetRow,values});await loadData();alert(msg)}catch(e){$('formMsg').textContent=e.message}}
async function removeEmployee(idx){if(!confirm('متأكد من حذف سجل الموظف؟ لا يمكن التراجع عن الحذف.'))return;try{alert(await call('deleteEmployee',token,idx+2));await loadData()}catch(e){alert(e.message)}}
function viewEmployee(idx){const r=rows[idx];const ix=headers.indexOf('المسمى الوظيفي');const title=r[ix]||'';const d=descriptions.find(x=>x.source.trim()===title.trim()||x.title.trim()===title.trim());$('content').innerHTML='<div class="panel"><div class="top"><h2>'+esc(r[headers.indexOf('اسم الموظف')]||'ملف الموظف')+'</h2><button class="secondary" onclick="printEmployeeProfile()">طباعة الملف</button></div><div class="detail-grid">'+headers.map((h,i)=>'<div class="detail-item"><b>'+esc(h)+'</b>'+esc(r[i])+'</div>').join('')+'</div><hr><h3>التوصيف الوظيفي</h3>'+(d?'<div class="detail-grid"><div class="detail-item"><b>المسمى المعتمد</b>'+esc(d.title)+'</div><div class="detail-item"><b>الرئيس المباشر</b>'+esc(d.manager)+'</div><div class="detail-item"><b>المرؤوسون</b>'+esc(d.reports)+'</div><div class="detail-item"><b>المؤهلات المطلوبة</b>'+esc(d.qualifications)+'</div><div class="detail-item" style="grid-column:1/-1"><b>المهام والمسؤوليات</b>'+esc(d.duties).replace(/\n/g,'<br>')+'</div></div>':'<div class="notice">لم يتم العثور على توصيف مطابق حرفيًا لهذا المسمى. راجع ورقة JobDescriptions لإتمام المطابقة.</div>')+'<div class="toolbar" style="margin-top:18px"><button class="secondary" onclick="renderEmployees()">رجوع</button>'+(user.role!=='Viewer'?'<button onclick="openForm('+idx+')">تعديل البيانات</button>':'')+'</div></div>'}

function printEmployeeProfile(){
 const panel=$('content').querySelector('.panel');
 if(!panel)return;
 printHtml('ملف الموظف',panel.innerHTML);
}

function renderReports(){
 $('content').innerHTML='<div class="cards"><div class="card"><h3>كشف الموظفين</h3><p class="muted">طباعة الأعمدة الأساسية للموظفين فقط.</p><button onclick="printEmployees()">عرض وطباعة الكشف</button></div><div class="card"><h3>حسب الإدارة</h3><select id="dept"><option value="">كل الإدارات</option>'+[...new Set(rows.map(r=>r[headers.indexOf('الإدارة')]).filter(Boolean))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><button style="margin-top:12px" onclick="reportDept()">عرض التقرير</button></div></div><div id="reportOut"></div>'
}
function reportDept(){
 const d=$('dept').value;
 const cols=listColumnIndexes();
 const list=rows.filter(r=>!d||r[headers.indexOf('الإدارة')]===d);
 const table='<table><thead><tr>'+cols.map(i=>'<th>'+esc(headers[i])+'</th>').join('')+'</tr></thead><tbody>'+list.map(r=>'<tr>'+cols.map(i=>'<td>'+esc(r[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 $('reportOut').innerHTML='<div class="panel"><h3>كشف '+esc(d||'جميع الإدارات')+' — '+list.length+' موظف</h3><button onclick="printDepartmentReport()">طباعة التقرير</button><div class="table-wrap">'+table+'</div></div>';
 window.currentDepartmentReport={title:'كشف '+(d||'جميع الإدارات'),table:table,count:list.length};
}
function printDepartmentReport(){
 const r=window.currentDepartmentReport;
 if(!r)return;
 printHtml(r.title,r.table,'عدد الموظفين: '+r.count);
}
async function renderUsers(){try{const us=await call('listHRUsers',token);$('content').innerHTML='<div class="panel"><h3>إضافة مستخدم</h3><div class="form-grid"><label>اسم المستخدم<input id="newU"></label><label>كلمة المرور (12 حرفًا على الأقل)<input id="newP" type="password"></label><label>الصلاحية<select id="newR"><option>Viewer</option><option>Editor</option><option>Admin</option></select></label></div><button style="margin-top:14px" onclick="createUser()">إنشاء المستخدم</button></div><div class="panel" style="margin-top:14px"><h3>المستخدمون الحاليون</h3><div class="table-wrap"><table><thead><tr><th>اسم المستخدم</th><th>الدور</th><th>الحالة</th></tr></thead><tbody>'+us.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.active)+'</td></tr>').join('')+'</tbody></table></div></div>'}catch(e){$('content').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}async function createUser(){try{alert(await call('addHRUser',token,{username:$('newU').value,password:$('newP').value,role:$('newR').value}));renderUsers()}catch(e){alert(e.message)}}
</script><iframe id="ohiBridge" title="OHI HR backend connection" src="https://script.google.com/macros/s/AKfycbxPGCmuDFA3RCcmApEJmTS1Df7gqtmQuEcHPH4R8OU5zJQMjvVXmhoTUmfj3OROQ205gw/exec?bridge=1" style="display:none" aria-hidden="true"></iframe>
